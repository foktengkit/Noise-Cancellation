services:
  - type: web
    name: noise-reduction-web
    runtime: python
    plan: free
    buildCommand: pip install --require-hashes -r requirements.lock
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1 --no-proxy-headers --ws-max-size 131072 --ws-max-queue 4
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8
      - key: COOKIE_SECURE
        value: "1"
